name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name for the draft release & zip names (e.g. 1.2.0)"
        required: false
        default: ""

# Needed for the release step to create tags/releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      # net48 builds fine on Linux via the Microsoft.NETFramework.ReferenceAssemblies
      # package each project references. The per-project PostBuild copy steps are
      # skipped automatically because GITHUB_ACTIONS=true on runners.
      - name: Build solution
        run: dotnet build PieMods.sln -c Release

      - name: Determine version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="$(date +%Y.%m.%d)-${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Package mods
        run: bash build/package.sh Release

      # One artifact per mod, named exactly after the mod folder.
      # Keep this list in sync with MODS in build/package.sh.
      - name: Upload CustomPostersAndStickers
        uses: actions/upload-artifact@v4
        with: { name: CustomPostersAndStickers, path: dist/CustomPostersAndStickers }
      - name: Upload DebugMenu
        uses: actions/upload-artifact@v4
        with: { name: DebugMenu, path: dist/DebugMenu }
      - name: Upload EndGameDebtModifier
        uses: actions/upload-artifact@v4
        with: { name: EndGameDebtModifier, path: dist/EndGameDebtModifier }
      - name: Upload FOVAdjuster
        uses: actions/upload-artifact@v4
        with: { name: FOVAdjuster, path: dist/FOVAdjuster }
      - name: Upload ModdedShipLoader
        uses: actions/upload-artifact@v4
        with: { name: ModdedShipLoader, path: dist/ModdedShipLoader }
      - name: Upload PieChallengeMode
        uses: actions/upload-artifact@v4
        with: { name: PieChallengeMode, path: dist/PieChallengeMode }
      - name: Upload ShiftRecorder
        uses: actions/upload-artifact@v4
        with: { name: ShiftRecorder, path: dist/ShiftRecorder }
      - name: Upload UpgradeCostAdjuster
        uses: actions/upload-artifact@v4
        with: { name: UpgradeCostAdjuster, path: dist/UpgradeCostAdjuster }

      # Releases only for tag pushes (published) or manual runs (draft to review).
      - name: Publish release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.ver.outputs.version }}
          name: PieMods ${{ steps.ver.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: dist/*.zip
